<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Valentine Letter</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #CBE9EF;
    font-family: "Georgia", serif;
}

/* Container */
.container {
    position: relative;
}

/* Envelope */
.envelope {
    width: 260px;
    height: 160px;
    position: relative;
    cursor: pointer;
}

.base {
    width: 100%;
    height: 100%;
    background: white;
    border: 2px solid #ccc;
    position: absolute;
    bottom: 0;
}

.flap {
    width: 0;
    height: 0;
    border-left: 130px solid transparent;
    border-right: 130px solid transparent;
    border-bottom: 80px solid white;
    position: absolute;
    top: -80px;
    left: 0;
    transform-origin: bottom;
    transition: transform 0.6s ease;
}

.envelope.open .flap {
    transform: rotateX(180deg);
}


.paper {
    width: 420px;
    height: 600px;
    background: white;
    border: 2px solid #ccc;
    position: absolute;
    left: 50%;
    top: 20px;
    transform: translate(-50%, 20px) scale(0.85);
    padding: 50px;
    box-sizing: border-box;
    opacity: 0;
    transition: all 0.8s ease;
    overflow-y: auto;
    line-height: 1.6;
    z-index: -1;
}


.paper.show {
    opacity: 1;
    transform: translate(-50%, -320px) scale(1);
    z-index: 1;
}


.paper::-webkit-scrollbar {
    width: 6px;
}

.paper::-webkit-scrollbar-thumb {
    background: #ddd;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="container">
    <div class="envelope" id="envelope">
        <div class="flap"></div>
        <div class="base"></div>
    </div>

    <div class="paper" id="paper">
        
        /* write your letter here */
        
        <p>
    
        </p>
    </div>
</div>

<script>
const envelope = document.getElementById("envelope");
const paper = document.getElementById("paper");

envelope.addEventListener("click", () => {
    envelope.classList.add("open");
    paper.classList.add("show");
});
</script>

</body>
</html>
